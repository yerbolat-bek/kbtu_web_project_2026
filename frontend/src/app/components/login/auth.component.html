<div class="auth-wrapper">
  <div class="auth-card">

    <div class="tabs">
      <span [class.active]="isLoginMode" (click)="toggleMode(true)">Sign In</span>
      <span [class.active]="!isLoginMode" (click)="toggleMode(false)">Create Account</span>
    </div>

    @if (errorMessage) {
      <div class="error-message">{{ errorMessage }}</div>
    }

    @if (successMessage) {
      <div class="success-message">{{ successMessage }}</div>
    }

    <form (ngSubmit)="onSubmit()">

      <div class="input-group">
        <label>Username</label>
        <input
          type="text"
          [(ngModel)]="authData.username"
          name="username"
          placeholder="Enter your username"
          required>
      </div>

      @if (!isLoginMode) {
        <div class="input-group">
          <label>Email</label>
          <input
            type="email"
            [(ngModel)]="authData.email"
            name="email"
            placeholder="Enter your email">
        </div>
      }

      <div class="input-group">
        <label>Password</label>
        <input
          type="password"
          [(ngModel)]="authData.password"
          name="password"
          placeholder="Enter your password"
          required>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        @if (isLoading) {
          Загрузка...
        } @else {
          {{ isLoginMode ? 'Sign In' : 'Register' }}
        }
      </button>
    </form>

    <div class="footer-text">
      @if (isLoginMode) {
        Don't have an account?
        <span (click)="toggleMode(false)">Create one</span>
      } @else {
        Already have an account?
        <span (click)="toggleMode(true)">Sign In</span>
      }
    </div>

  </div>
</div>
